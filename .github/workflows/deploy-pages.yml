name: Build and Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'Confirm that this run may publish the game publicly on GitHub Pages'
        type: boolean
        required: true
        default: false

# Normal pushes and pull requests never publish this project.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_publication == true && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build, package and verify the versioned release
        run: npm run package:release

      - name: Upload static site for GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

      - name: Retain the versioned release package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wuxia-rpg-web-${{ github.sha }}
          path: |
            release/*.tgz
            release/*.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    if: ${{ inputs.confirm_publication == true && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
